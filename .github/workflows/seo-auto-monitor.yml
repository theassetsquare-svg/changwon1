name: SEO Auto Monitor (24h)

# 24시간 자동화: 6시간마다 빌드 → 키워드 스터핑 검사 → 라이브 사이트 헬스체크
# 실패 시 자동으로 GitHub Issue 생성

on:
  schedule:
    # 매일 00:00, 06:00, 12:00, 18:00 KST = 15:00, 21:00, 03:00, 09:00 UTC
    - cron: '0 15,21,3,9 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-monitor
  cancel-in-progress: false

jobs:
  build-and-audit:
    name: Build + Keyword Stuffing Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Keyword stuffing check
        id: seo
        run: |
          set -o pipefail
          npm run check:seo | tee seo-report.txt

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report-${{ github.run_number }}
          path: seo-report.txt
          retention-days: 14

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '(report not generated)';
            try { report = fs.readFileSync('seo-report.txt', 'utf8').slice(-3500); } catch (e) {}
            const title = `🚨 SEO 자동검사 실패 — run #${context.runNumber}`;
            const body = [
              `자동 모니터(${context.workflow})가 실패했습니다.`,
              ``,
              `- 트리거: \`${context.eventName}\``,
              `- 커밋: \`${context.sha.substring(0,7)}\``,
              `- 실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `### 키워드 스터핑 리포트 (마지막 3,500자)`,
              '```',
              report,
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['seo', 'automated'],
            });

  live-healthcheck:
    name: Live Site Health Check
    runs-on: ubuntu-latest
    needs: build-and-audit
    steps:
      - name: Probe live pages
        id: probe
        run: |
          set -e
          BASE="https://changwon1.pages.dev"
          PAGES=("/" "/about/" "/jjanggu/" "/location/" "/contact/" "/sitemap.xml" "/robots.txt" "/llms.txt")
          FAIL=0
          REPORT=""
          for p in "${PAGES[@]}"; do
            URL="$BASE$p"
            CODE=$(curl -L -o /tmp/body -s -w "%{http_code}" -A "Mozilla/5.0 (SEO-Monitor changwon1)" --max-time 30 "$URL")
            SIZE=$(wc -c < /tmp/body | tr -d ' ')
            LINE="$CODE  ${SIZE}B  $URL"
            echo "$LINE"
            REPORT="$REPORT$LINE\n"
            if [ "$CODE" != "200" ] || [ "$SIZE" -lt 200 ]; then
              FAIL=1
            fi
            # 핵심 페이지 내용 검증
            if [ "$p" = "/" ] || [ "$p" = "/jjanggu/" ]; then
              if ! grep -q "010-3854-6887\|01038546887" /tmp/body; then
                echo "::warning::Phone number missing on $URL"
                FAIL=1
              fi
              if ! grep -qi "<title>" /tmp/body; then
                echo "::warning::Title tag missing on $URL"
                FAIL=1
              fi
            fi
          done
          printf "$REPORT" > live-report.txt
          if [ $FAIL -ne 0 ]; then exit 1; fi

      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report-${{ github.run_number }}
          path: live-report.txt
          retention-days: 14

      - name: Create issue on live failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '(no live report)';
            try { report = fs.readFileSync('live-report.txt', 'utf8'); } catch (e) {}
            const title = `🚨 라이브 사이트 헬스체크 실패 — run #${context.runNumber}`;
            const body = [
              `라이브 사이트(https://changwon1.pages.dev) 응답에 문제가 있습니다.`,
              ``,
              `- 트리거: \`${context.eventName}\``,
              `- 실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `### 응답 코드`,
              '```',
              report,
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['site-down', 'automated'],
            });
