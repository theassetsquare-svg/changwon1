name: SEO Auto Monitor (24h)

# 24시간 자동화: 6시간마다 빌드 → 키워드 스터핑 검사 → 라이브 사이트 헬스체크
# 실패 시 → ① GitHub Issue 생성  ② theassetsquare@gmail.com 이메일 알림(시크릿 설정 시)
#
# 이메일 알림 활성화에 필요한 저장소 시크릿(Settings > Secrets and variables > Actions):
#   MAIL_USERNAME = theassetsquare@gmail.com
#   MAIL_PASSWORD = Gmail 앱 비밀번호 (16자리, 일반 비번 아님)
#                   https://myaccount.google.com/apppasswords 에서 발급
#   ALERT_TO      = (선택) 수신 주소. 미설정 시 theassetsquare@gmail.com

on:
  schedule:
    # 매일 00:00, 06:00, 12:00, 18:00 KST = 15:00, 21:00, 03:00, 09:00 UTC
    - cron: '0 15,21,3,9 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-monitor
  cancel-in-progress: false

jobs:
  build-and-audit:
    name: Build + Keyword Stuffing Audit
    runs-on: ubuntu-latest
    outputs:
      mail_enabled: ${{ steps.mailcfg.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check mail config
        id: mailcfg
        run: |
          if [ -n "${{ secrets.MAIL_PASSWORD }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MAIL_PASSWORD 시크릿 미설정 — 이메일 알림은 건너뜁니다(이슈는 생성됨)."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      - name: Keyword stuffing check
        id: seo
        run: |
          set -o pipefail
          npm run check:seo | tee seo-report.txt

      - name: Upload SEO report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-report-${{ github.run_number }}
          path: seo-report.txt
          retention-days: 14

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '(report not generated)';
            try { report = fs.readFileSync('seo-report.txt', 'utf8').slice(-3500); } catch (e) {}
            const title = `🚨 SEO 자동검사 실패 — run #${context.runNumber}`;
            const body = [
              `자동 모니터(${context.workflow})가 실패했습니다.`,
              ``,
              `- 트리거: \`${context.eventName}\``,
              `- 커밋: \`${context.sha.substring(0,7)}\``,
              `- 실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `### 키워드 스터핑 리포트 (마지막 3,500자)`,
              '```',
              report,
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['seo', 'automated'],
            });

      - name: Email alert on failure
        if: ${{ failure() && steps.mailcfg.outputs.enabled == 'true' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 창원 룰루랄라 SEO 모니터 <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.ALERT_TO || 'theassetsquare@gmail.com' }}
          subject: "🚨 [changwond] SEO 빌드/검사 실패 — run #${{ github.run_number }}"
          body: |
            창원 룰루랄라 나이트 사이트 자동검사(빌드+키워드)에서 문제가 감지됐습니다.

            트리거: ${{ github.event_name }}
            커밋: ${{ github.sha }}
            실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            첨부/아티팩트의 seo-report.txt 를 확인하세요.
            (이 메일은 자동 발송입니다. 자동 복구 루틴이 동작 중이면 곧 후속 메일이 옵니다.)

  live-healthcheck:
    name: Live Site Health Check
    runs-on: ubuntu-latest
    needs: build-and-audit
    steps:
      - name: Probe live pages
        id: probe
        run: |
          set -e
          BASE="https://changwond.pages.dev"
          PAGES=("/" "/about/" "/jjanggua/" "/location/" "/contacta/" "/sitemap.xml" "/robots.txt" "/llms.txt" "/og-cover.png" "/og-default.png")
          FAIL=0
          REPORT=""
          for p in "${PAGES[@]}"; do
            URL="$BASE$p"
            CODE=$(curl -L -o /tmp/body -s -w "%{http_code}" -A "Mozilla/5.0 (SEO-Monitor changwond)" --max-time 30 "$URL")
            SIZE=$(wc -c < /tmp/body | tr -d ' ')
            LINE="$CODE  ${SIZE}B  $URL"
            echo "$LINE"
            REPORT="$REPORT$LINE\n"
            if [ "$CODE" != "200" ] || [ "$SIZE" -lt 200 ]; then
              FAIL=1
            fi
            # 핵심 페이지 내용 검증
            # 홈(/)은 전화 안내가 없는 단독 글 페이지라 번호 검사 대상에서 뺀다.
            if [ "$p" = "/jjanggua/" ]; then
              if ! grep -q "010-7528-4936\|01075284936" /tmp/body; then
                echo "::warning::Phone number missing on $URL"
                FAIL=1
              fi
              if ! grep -qi "<title>" /tmp/body; then
                echo "::warning::Title tag missing on $URL"
                FAIL=1
              fi
            fi
          done
          printf "$REPORT" > live-report.txt
          if [ $FAIL -ne 0 ]; then exit 1; fi

      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-report-${{ github.run_number }}
          path: live-report.txt
          retention-days: 14

      - name: Create issue on live failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '(no live report)';
            try { report = fs.readFileSync('live-report.txt', 'utf8'); } catch (e) {}
            const title = `🚨 라이브 사이트 헬스체크 실패 — run #${context.runNumber}`;
            const body = [
              `라이브 사이트(https://changwond.pages.dev) 응답에 문제가 있습니다.`,
              ``,
              `- 트리거: \`${context.eventName}\``,
              `- 실행: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `### 응답 코드`,
              '```',
              report,
              '```',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['site-down', 'automated'],
            });

      - name: Email alert on live failure
        if: ${{ failure() && needs.build-and-audit.outputs.mail_enabled == 'true' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: 창원 룰루랄라 SEO 모니터 <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.ALERT_TO || 'theassetsquare@gmail.com' }}
          subject: "🚨 [changwond] 라이브 사이트 응답 이상 — run #${{ github.run_number }}"
          body: |
            라이브 사이트(https://changwond.pages.dev) 헬스체크에서 비정상 응답이 감지됐습니다.

            실행 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            아티팩트의 live-report.txt 에서 각 페이지 응답 코드를 확인하세요.
